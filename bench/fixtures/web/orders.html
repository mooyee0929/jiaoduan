<!doctype html>
<!-- A long orders table for lookup tasks. Rows are generated from a fixed seed, so the page is
     the same every run; the answer is never in the page source. -->
<meta charset="utf-8">
<title>Orders</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; }
  table { border-collapse: collapse; }
  td, th { border-bottom: 1px solid #ddd; padding: 4px 10px; text-align: left; }
</style>
<main>
  <h1>Orders</h1>
  <p>Showing the last 120 orders.</p>
  <table aria-label="Orders">
    <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Items</th><th>Total</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  let seed = 20261109;
  const next = () => {  // mulberry32: 32-bit integer math, identical in every engine
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const names = ['Avery', 'Blake', 'Casey', 'Devon', 'Emery', 'Finley', 'Harper', 'Jordan',
    'Kendall', 'Logan', 'Morgan', 'Parker', 'Quinn', 'Riley', 'Rowan', 'Sawyer'];
  const statuses = ['Paid', 'Shipped', 'Refunded', 'Pending'];
  const money = (cents) => '$' + (cents / 100).toLocaleString('en-US', {minimumFractionDigits: 2});
  const rows = document.getElementById('rows');
  for (let i = 0; i < 120; i++) {
    const order = 1000 + i;
    const items = 1 + Math.floor(next() * 9);
    const cents = 1500 + Math.floor(next() * 250000);
    const row = rows.insertRow();
    for (const value of [`#${order}`, names[Math.floor(next() * names.length)],
      statuses[Math.floor(next() * statuses.length)], String(items), money(cents)]) {
      row.insertCell().textContent = value;
    }
  }
</script>
