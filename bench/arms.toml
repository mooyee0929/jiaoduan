# What each arm may use. Every arm gets no built-in tools (`--tools ""`), so the only way to
# reach the page is through its MCP server. `{python}` is this interpreter.
#
# A and B are Playwright MCP, pinned to a release more than two weeks old, using the
# installed Chrome. Neither may run page JavaScript: that would let an agent write the page's
# state directly instead of operating the UI.

[arm.A]
label = "screenshots and coordinates (Playwright MCP vision)"
server = "playwright"
command = ["npx", "-y", "@playwright/mcp@0.0.83", "--headless", "--isolated",
           "--browser=chrome", "--caps=vision"]
tools = ["browser_navigate", "browser_take_screenshot", "browser_mouse_click_xy",
         "browser_press_key", "browser_wait_for", "browser_file_upload"]

[arm.B]
label = "accessibility snapshot (Playwright MCP default)"
server = "playwright"
command = ["npx", "-y", "@playwright/mcp@0.0.83", "--headless", "--isolated",
           "--browser=chrome"]
tools = ["browser_navigate", "browser_snapshot", "browser_click", "browser_type",
         "browser_press_key", "browser_select_option", "browser_fill_form",
         "browser_file_upload", "browser_wait_for", "browser_hover", "browser_find",
         "browser_handle_dialog", "browser_tabs"]

[arm.C]
label = "agent-layer elements (observe and act)"
server = "agent-layer"
command = ["{python}", "-m", "agentlayer.mcp_server"]
tools = ["surfaces", "open", "observe", "act", "key", "read", "wait"]

[arm.D]
label = "agent-layer forms (form and fill)"
server = "agent-layer"
command = ["{python}", "-m", "agentlayer.mcp_server"]
tools = ["surfaces", "open", "observe", "act", "key", "read", "wait", "form", "fill"]
only_kinds = ["form"]
