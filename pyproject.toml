[project]
name = "agent-layer"
version = "0.0.1"
description = "A verified, screenshot-free interface for AI agents to third-party web pages and macOS apps."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mooyee0929" }]
dependencies = [
    "mcp>=2.2",
]

[project.optional-dependencies]
mac = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
agentlayer = "agentlayer.cli:main"
agentlayer-mcp = "agentlayer.mcp_server:main"
agentlayerd = "agentlayer.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "chrome: drives a real headless Chrome",
    "mac: drives real macOS accessibility against a fixture app",
]
addopts = "-m 'not chrome and not mac'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"spikes/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "objc", "AppKit", "Foundation", "ApplicationServices", "HIServices", "Quartz",
    "CoreFoundation",
]
ignore_missing_imports = true
